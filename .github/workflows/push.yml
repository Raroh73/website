name: "Check Push & Build Image"
on:
  push:
    branches:
      - "main"
jobs:
  tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
      - name: Set Up Node
        uses: actions/setup-node@v7.1.0
      - name: Install Dependencies
        run: npm ci
      - name: Build Website
        run: npm run astro:build
      - name: Run Typescript Checks
        run: npm run typescript:check
      - name: Run Biome Checks
        run: npm run biome:check
      - name: Run Vitest Tests
        run: npm run vitest:test
      - name: Upload Vitest Coverage
        uses: actions/upload-artifact@v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 30
      - name: Install Playwright Browsers
        run: npm run playwright:install
      - name: Run Playwright Tests
        run: npm run playwright:test
      - name: Upload Playwright Report
        uses: actions/upload-artifact@v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30
  build:
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7.0.1
      - name: Generate Docker Metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ghcr.io/raroh73/website
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=sha
        env:
          DOCKER_METADATA_ANNOTATIONS_LEVELS: manifest,index
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ghcr.io
          username: raroh73
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v4.4.0
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build and Push
        uses: docker/build-push-action@v7.4.0
        with:
          push: true
          platforms: linux/amd64, linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          annotations: ${{ steps.meta.outputs.annotations }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha, mode=max
